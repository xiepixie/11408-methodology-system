      <text x="275" y="80">31–25</text>
      <text x="450" y="80">24–20</text>
      <text x="610" y="80">19–15</text>
      <text x="760" y="80">14–12</text>
      <text x="910" y="80">11–7</text>
      <text x="1085" y="80">6–0</text>
      <text x="1370" y="80">指令功能说明</text>
