<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">题36 DHCP 报文交换过程</title>
<desc id="desc">主机 H 与地址为 192.168.5.1 的 DHCP 服务器之间依次交换 DHCPOFFER 和 DHCPREQUEST，两报文均标注 yiaddr 为 192.168.5.9。</desc>

<style>
  @media print, (prefers-color-scheme: light) {
    [fill="#30362d"], [fill="#30362D"], [fill="#30362d" i] { fill: #fafaf7 !important; }
    [stroke="#30362d"], [stroke="#30362D"], [stroke="#30362d" i] { stroke: #fafaf7 !important; }
    [fill="#edf4e8"], [fill="#EDF4E8"], [fill="#edf4e8" i] { fill: #111111 !important; }
    [stroke="#edf4e8"], [stroke="#EDF4E8"], [stroke="#edf4e8" i] { stroke: #111111 !important; }
    [fill="#9ea897"], [fill="#9EA897"], [fill="#9ea897" i] { fill: #666666 !important; }
    [stroke="#9ea897"], [stroke="#9EA897"], [stroke="#9ea897" i] { stroke: #666666 !important; }
  }
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#edf4e8"/></marker>
</defs>
<rect width="100%" height="100%" rx="14" ry="14" fill="#30362d"/>
<g id="host-h">
  <text x="170" y="55" class="t big" text-anchor="middle">H</text>
  <rect x="125" y="82" width="90" height="58" rx="4" class="device"/>
  <rect x="143" y="96" width="54" height="30" rx="2" fill="#30362d" stroke="#edf4e8" stroke-width="1.8"/>
  <line x1="170" y1="140" x2="170" y2="580" class="line" marker-end="url(#arrow)"/>
  <text x="112" y="570" class="t small">时间</text>
</g>
<g id="dhcp-server">
  <text x="730" y="48" class="t big" text-anchor="middle">DHCP服务器</text>
  <text x="730" y="78" class="t mid" text-anchor="middle">192.168.5.1</text>
  <rect x="695" y="94" width="70" height="72" rx="5" class="device"/>
  <line x1="708" y1="112" x2="752" y2="112" class="line"/><line x1="708" y1="126" x2="752" y2="126" class="line"/><line x1="708" y1="140" x2="752" y2="140" class="line"/>
  <line x1="730" y1="166" x2="730" y2="580" class="line" marker-end="url(#arrow)"/>
</g>
<g id="dhcpoffer">
  <text x="455" y="205" class="t mid" text-anchor="middle">DHCPOFFER</text>
  <line x1="730" y1="236" x2="170" y2="330" class="line" marker-end="url(#arrow)"/>
  <rect x="345" y="222" width="250" height="115" class="box"/>
  <text x="470" y="258" class="t mid" text-anchor="middle">…</text>
  <text x="470" y="296" class="t mid" text-anchor="middle">yiaddr: 192.168.5.9</text>
  <text x="470" y="325" class="t mid" text-anchor="middle">…</text>
</g>
<g id="dhcprequest">
  <text x="455" y="392" class="t mid" text-anchor="middle">DHCPREQUEST</text>
  <line x1="170" y1="420" x2="730" y2="515" class="line" marker-end="url(#arrow)"/>
  <rect x="345" y="404" width="250" height="115" class="box"/>
  <text x="470" y="440" class="t mid" text-anchor="middle">…</text>
  <text x="470" y="478" class="t mid" text-anchor="middle">yiaddr: 192.168.5.9</text>
  <text x="470" y="507" class="t mid" text-anchor="middle">…</text>
</g>
</svg>