<svg xmlns="http://www.w3.org/2000/svg" width="560" height="720" viewBox="0 0 560 720" role="img" aria-labelledby="title desc">
<title id="title">题46 进程虚拟地址空间布局</title>
<desc id="desc">从高地址到低地址依次为内核区、用户栈、未占用区、运行时堆、可读写数据段、只读代码段、未占用区。阴影表示未占用区域。</desc>

<style>
  @media print, (prefers-color-scheme: light) {
    [fill="#30362d"], [fill="#30362D"], [fill="#30362d" i] { fill: #fafaf7 !important; }
    [stroke="#30362d"], [stroke="#30362D"], [stroke="#30362d" i] { stroke: #fafaf7 !important; }
    [fill="#edf4e8"], [fill="#EDF4E8"], [fill="#edf4e8" i] { fill: #111111 !important; }
    [stroke="#edf4e8"], [stroke="#EDF4E8"], [stroke="#edf4e8" i] { stroke: #111111 !important; }
    [fill="#9ea897"], [fill="#9EA897"], [fill="#9ea897" i] { fill: #666666 !important; }
    [stroke="#9ea897"], [stroke="#9EA897"], [stroke="#9ea897" i] { stroke: #666666 !important; }
  }
</style>
<defs></defs>
<rect width="100%" height="100%" fill="#30362d" rx="14" ry="14"/>
<g id="address-space" transform="translate(135,35)">
  <g id="kernel"><rect x="0" y="0" width="290" height="92" class="cell"/><text x="145" y="56" class="t mid" text-anchor="middle">内核区</text></g>
  <g id="user-stack"><rect x="0" y="92" width="290" height="82" class="cell"/><text x="145" y="142" class="t mid" text-anchor="middle">用户栈</text></g>
  <g id="gap-high"><rect x="0" y="174" width="290" height="92" class="gap"/></g>
  <g id="runtime-heap"><rect x="0" y="266" width="290" height="92" class="cell"/><text x="145" y="322" class="t mid" text-anchor="middle">运行时堆</text></g>
  <g id="rw-data"><rect x="0" y="358" width="290" height="92" class="cell"/><text x="145" y="414" class="t mid" text-anchor="middle">可读写数据段</text></g>
  <g id="ro-code"><rect x="0" y="450" width="290" height="92" class="cell"/><text x="145" y="506" class="t mid" text-anchor="middle">只读代码段</text></g>
  <g id="gap-low"><rect x="0" y="542" width="290" height="82" class="gap"/></g>
</g>
</svg>