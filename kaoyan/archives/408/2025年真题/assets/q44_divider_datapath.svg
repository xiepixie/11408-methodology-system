<svg xmlns="http://www.w3.org/2000/svg" width="980" height="610" viewBox="0 0 980 610" role="img" aria-labelledby="title desc">
<title id="title">题44图(b) 补码除法器逻辑结构</title>
<desc id="desc">除数寄存器Y连接32位ALU，ALU连接余数寄存器R与余数/商寄存器Q；控制逻辑产生ALUop、左移和写使能信号，并接收时钟。</desc>

<style>
  @media print, (prefers-color-scheme: light) {
    [fill="#30362d"], [fill="#30362D"], [fill="#30362d" i] { fill: #fafaf7 !important; }
    [stroke="#30362d"], [stroke="#30362D"], [stroke="#30362d" i] { stroke: #fafaf7 !important; }
    [fill="#edf4e8"], [fill="#EDF4E8"], [fill="#edf4e8" i] { fill: #111111 !important; }
    [stroke="#edf4e8"], [stroke="#EDF4E8"], [stroke="#edf4e8" i] { stroke: #111111 !important; }
    [fill="#9ea897"], [fill="#9EA897"], [fill="#9ea897" i] { fill: #666666 !important; }
    [stroke="#9ea897"], [stroke="#9EA897"], [stroke="#9ea897" i] { stroke: #666666 !important; }
  }
</style>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#edf4e8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#30362d" rx="14" ry="14"/>
<g id="divisor-y"><rect x="355" y="38" width="210" height="58" class="node"/><text x="460" y="75" class="t mid" text-anchor="middle">除数寄存器 Y</text></g>
<g id="alu"><path d="M215 165 L345 165 L380 205 L540 205 L575 165 L705 165 L635 300 L285 300 Z" class="node"/><text x="460" y="258" class="t big" text-anchor="middle">32位 ALU</text></g>
<g id="rq"><rect x="245" y="390" width="445" height="72" class="node"/><line x1="468" y1="390" x2="468" y2="462" class="line"/><text x="355" y="434" class="t mid" text-anchor="middle">余数寄存器 R</text><text x="579" y="434" class="t mid" text-anchor="middle">余数/商寄存器 Q</text></g>
<g id="control"><rect x="760" y="388" width="150" height="78" rx="34" class="node"/><text x="835" y="437" class="t mid" text-anchor="middle">控制逻辑</text></g>
<g id="data-y"><line x1="460" y1="96" x2="545" y2="165" class="line" marker-end="url(#arrow)"/><text x="505" y="132" class="t mid">32</text></g>
<g id="data-r-feedback"><path d="M355 390 L355 350 L155 350 L155 148 L270 148 L305 165" class="line" marker-end="url(#arrow)"/><text x="190" y="178" class="t mid">32</text></g>
<g id="alu-to-r"><line x1="355" y1="300" x2="355" y2="390" class="line" marker-end="url(#arrow)"/><text x="372" y="352" class="t mid">32</text></g>
<g id="rq-width"><text x="520" y="492" class="t mid" text-anchor="middle">32位</text><line x1="355" y1="462" x2="355" y2="530" class="line"/><path d="M355 530 H835 V466" class="line" marker-end="url(#arrow)"/><text x="372" y="515" class="t mid">32</text></g>
<g id="aluop"><path d="M835 388 V230 H706" class="dash" marker-end="url(#arrow)"/><text x="732" y="215" class="t mid">ALUop</text></g>
<g id="shift-enable"><line x1="760" y1="410" x2="692" y2="410" class="dash" marker-end="url(#arrow)"/><text x="720" y="395" class="t mid" text-anchor="middle">左移</text><line x1="760" y1="448" x2="692" y2="448" class="dash" marker-end="url(#arrow)"/><text x="720" y="478" class="t mid" text-anchor="middle">写使能</text></g>
<g id="clock"><line x1="835" y1="548" x2="835" y2="466" class="line" marker-end="url(#arrow)"/><text x="858" y="535" class="t mid">时钟</text></g>
</svg>