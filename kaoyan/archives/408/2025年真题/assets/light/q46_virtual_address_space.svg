<svg xmlns="http://www.w3.org/2000/svg" width="560" height="720" viewBox="0 0 560 720" role="img" aria-labelledby="title desc"><title id="title">题46 进程虚拟地址空间布局</title><desc id="desc">从高地址到低地址依次为内核区、用户栈、未占用区、运行时堆、可读写数据段、只读代码段、未占用区。阴影表示未占用区域。</desc><defs><style>.t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111}.mid{font-size:24px}.line{stroke:#111;stroke-width:2.4}.cell{fill:#fff;stroke:#111;stroke-width:2.4}.gap{fill:#dedfd9;stroke:#111;stroke-width:2.4}</style></defs><rect width="100%" height="100%" fill="#fafaf7" rx="14" ry="14"/><g id="address-space" transform="translate(135,35)"><g id="kernel"><rect x="0" y="0" width="290" height="92" class="cell"/><text x="145" y="56" class="t mid" text-anchor="middle">内核区</text></g><g id="user-stack"><rect x="0" y="92" width="290" height="82" class="cell"/><text x="145" y="142" class="t mid" text-anchor="middle">用户栈</text></g><g id="gap-high"><rect x="0" y="174" width="290" height="92" class="gap"/></g><g id="runtime-heap"><rect x="0" y="266" width="290" height="92" class="cell"/><text x="145" y="322" class="t mid" text-anchor="middle">运行时堆</text></g><g id="rw-data"><rect x="0" y="358" width="290" height="92" class="cell"/><text x="145" y="414" class="t mid" text-anchor="middle">可读写数据段</text></g><g id="ro-code"><rect x="0" y="450" width="290" height="92" class="cell"/><text x="145" y="506" class="t mid" text-anchor="middle">只读代码段</text></g><g id="gap-low"><rect x="0" y="542" width="290" height="82" class="gap"/></g></g></svg>