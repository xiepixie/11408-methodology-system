<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="610" viewBox="0 0 1320 610" role="img" aria-labelledby="title desc">
<title id="title">题47 工程部与公司总部网络</title>
<desc id="desc">工程部网络包含管理区、作业区和生活区子网，R1 经 TR1、天通一号卫星、TR2 与公司总部 R2 相连；总部网络含 S2、总部服务器及 Internet 连接。</desc>

