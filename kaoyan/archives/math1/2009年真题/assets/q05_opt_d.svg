<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 190" width="240" height="190">
  <style>
    .bg { fill: #2e362c; }
    .fg { stroke: #edf4e8; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .axis { stroke: #edf4e8; stroke-width: 1.8; fill: none; }
    .grid { stroke: #596452; stroke-width: 1; stroke-dasharray: 4,4; fill: none; }
    .curve { stroke: #edf4e8; stroke-width: 2.4; fill: none; }
    .curve-accent { stroke: #98c379; stroke-width: 2.4; fill: none; }
    .curve-dashed { stroke: #edf4e8; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
    .shade { fill: rgba(237, 244, 232, 0.15); stroke: #edf4e8; stroke-width: 1.5; }
    .plane1 { fill: rgba(152, 195, 121, 0.25); stroke: #edf4e8; stroke-width: 1.5; }
    .plane2 { fill: rgba(97, 175, 239, 0.25); stroke: #edf4e8; stroke-width: 1.5; }
    .plane3 { fill: rgba(229, 192, 123, 0.25); stroke: #edf4e8; stroke-width: 1.5; }
    .text { fill: #edf4e8; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', Arial, sans-serif; font-size: 15px; text-anchor: middle; }
    .text-sm { fill: #edf4e8; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', Arial, sans-serif; font-size: 13px; text-anchor: middle; }
    .text-xs { fill: #edf4e8; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', Arial, sans-serif; font-size: 11px; text-anchor: middle; }
    .point { fill: #edf4e8; }
  </style>
  <rect width="100%" height="100%" class="bg"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#edf4e8"/>
    </marker>
    <marker id="arrow-sm" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#edf4e8"/>
    </marker>
  </defs>
  
  <line x1="20" y1="120" x2="220" y2="120" class="axis" marker-end="url(#arrow-sm)"/>
  <line x1="70" y1="180" x2="70" y2="20" class="axis" marker-end="url(#arrow-sm)"/>
  <text x="215" y="138" class="text-sm">x</text>
  <text x="55" y="30" class="text-sm">y</text>
  <path d="M 30 100 Q 50 110 70 120 L 110 70 Q 150 40 190 100" class="curve"/>

</svg>